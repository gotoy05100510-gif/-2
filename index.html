<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自分専用ポモドーロ</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --card-border: #3a506b;
            --text-main: #ffffff;
            --text-sub: #8d99ae;
            --accent-gradient: linear-gradient(135deg, #4361ee, #7209b7);
            --accent-btn: #4361ee;
            --danger-bg: #ef233c;
            --streak-yellow: #ffd166;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            margin-bottom: 5px;
        }

        .studio-name {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .timer-display {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
            text-align: center;
            word-break: keep-all;
        }

        .timer-message {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
            text-align: center;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: var(--card-border);
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            flex: 2;
            background: var(--accent-gradient);
            color: white;
            padding: 16px;
        }

        .btn-secondary {
            flex: 1;
            background-color: #2b3a67;
            color: white;
            padding: 16px;
        }

        .btn-full {
            width: 100%;
            background-color: #2b3a67;
            color: white;
            padding: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }

        .setting-box {
            background-color: rgba(11, 19, 43, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .setting-label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .time-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time-input {
            width: 80px;
            background-color: #0b132b;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 6px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .time-input:focus {
            outline: none;
            border-color: var(--accent-btn);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
            color: var(--text-main);
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-btn);
            cursor: pointer;
        }

        .playlist-input-area {
            border: 2px dashed var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
            background-color: rgba(11, 19, 43, 0.3);
        }

        .url-input-row {
            display: flex;
            gap: 8px;
        }

        .url-input {
            flex: 1;
            background-color: #0b132b;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 14px;
        }

        .url-input:focus {
            outline: none;
            border-color: var(--accent-btn);
        }

        .btn-add {
            background-color: #4361ee;
            color: white;
            padding: 0 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .song-list {
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 5px;
        }

        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b132b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .song-item button {
            background: none;
            color: var(--danger-bg);
            font-size: 12px;
            padding: 2px 6px;
        }

        .no-song {
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            padding: 10px 0;
        }

        .streak-display {
            width: 100%;
            font-size: 20px;
            font-weight: 800;
            color: var(--streak-yellow);
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(255, 209, 102, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .stat-box {
            background-color: rgba(11, 19, 43, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        #ytPlayerModal {
            display: none;
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }
        #yt-player-frame {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="studio-name">Focus Studio</div>
            <h1>自分専用ポモドーロ</h1>
        </header>

        <!-- メインタイマー -->
        <div class="card">
            <div class="timer-display" id="timerDisplay">🎵 ウォーミングアップ</div>
            <div class="timer-message" id="timerMessage">まずは音楽で気分を高めましょう！</div>

            <div id="ytPlayerModal">
                <div style="font-size: 13px; color: #4cc9f0; margin-bottom: 8px;">✨ 音楽が終わると自動で勉強へスタート</div>
                <div id="yt-player-frame"></div>
            </div>

            <div class="divider" style="margin-top: 15px;"></div>

            <div class="button-group">
                <button class="btn-primary" id="startBtn" onclick="toggleTimer()">▶ 音楽からスタート</button>
                <button class="btn-secondary" onclick="resetTimer()">↺ リセット</button>
            </div>
            <button class="btn-full" onclick="skipTimer()">次のモードへ</button>
        </div>

        <!-- 時間設定 -->
        <div class="card">
            <div class="section-title">⏱ 時間設定</div>
            <div class="settings-grid">
                <div class="setting-box">
                    <span class="setting-label">勉強時間 (分)</span>
                    <div class="time-input-wrapper">
                        <input type="number" id="workTimeInput" class="time-input" value="25" min="1" max="180" onchange="updateCustomTime()">
                    </div>
                </div>
            </div>
            <label class="checkbox-label">
                <input type="checkbox" id="warmupCheck" checked onchange="toggleWarmupMode()"> 最初のスタート時に音楽（ウォーミングアップ）から始める
            </label>
        </div>

        <!-- 休憩用プレイリスト -->
        <div class="card">
            <div class="section-title">🎵 休憩用YouTubeプレイリスト</div>
            <div class="playlist-input-area">
                <div style="font-size: 13px; color: var(--text-sub);">YouTubeのURLまたは動画IDを追加してください。</div>
                <div class="url-input-row">
                    <input type="text" id="ytUrlInput" class="url-input" placeholder="例: https://youtu.be/xxxx">
                    <button class="btn-add" onclick="addYouTubeSong()">追加</button>
                </div>
            </div>
            <div id="songListContainer" class="song-list">
                <div class="no-song">まだ曲が選ばれていません。</div>
            </div>
        </div>

        <!-- 記録 -->
        <div class="card">
            <div class="section-title">📊 勉強の記録</div>
            <div class="streak-display" id="streakDisplay">🔥 1日連続！</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">本日の記録</span>
                    <span class="stat-value"><span id="todayMinutes">0</span>分</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">今週の合計</span>
                    <span class="stat-value"><span id="weekMinutes">0</span>分</span>
                </div>
            </div>
        </div>

        <div class="footer-note">
            ※音楽が終わると自動で勉強モードに移行します。
        </div>
    </div>

    <!-- YouTube API JS -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let workDuration = 25 * 60;
        let timeLeft = workDuration;
        let isRunning = false;
        let currentMode = 'warmup'; 
        
        let targetTimestamp = null;
        let timerInterval = null;

        let youtubeSongs = [];
        let ytPlayer = null;
        let isYtApiReady = false;

        let audioCtx = null;
        let noiseNode = null;
        let noiseGain = null;

        let historyData = {};

        function onYouTubeIframeAPIReady() {
            isYtApiReady = true;
        }

        function getTodayKey() {
            const d = new Date();
            return d.toISOString().split('T')[0];
        }

        function getMondayOfCurrentWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function loadStorageData() {
            const savedHistory = localStorage.getItem('pomodoro_history_v2');
            if (savedHistory) {
                historyData = JSON.parse(savedHistory);
            } else {
                const oldStats = localStorage.getItem('pomodoro_stats');
                if (oldStats) {
                    const data = JSON.parse(oldStats);
                    const today = getTodayKey();
                    historyData[today] = { sessions: data.sessions || 0, minutes: data.minutes || 0 };
                }
            }
            updateStatsUI();

            const savedSongs = localStorage.getItem('pomodoro_songs');
            if (savedSongs) {
                youtubeSongs = JSON.parse(savedSongs);
                updateSongListUI();
            }
        }

        function saveHistory() {
            localStorage.setItem('pomodoro_history_v2', JSON.stringify(historyData));
            updateStatsUI();
        }

        function saveSongs() {
            localStorage.setItem('pomodoro_songs', JSON.stringify(youtubeSongs));
            updateSongListUI();
        }

        function calculateStreak() {
            let streak = 0;
            let checkDate = new Date();

            const todayKey = checkDate.toISOString().split('T')[0];
            if (historyData[todayKey] && historyData[todayKey].minutes > 0) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            } else {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (true) {
                const key = checkDate.toISOString().split('T')[0];
                if (historyData[key] && historyData[key].minutes > 0) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        function updateStatsUI() {
            const todayKey = getTodayKey();
            const today = historyData[todayKey] || { sessions: 0, minutes: 0 };
            
            document.getElementById('todayMinutes').innerText = today.minutes;

            const now = new Date();
            const monday = getMondayOfCurrentWeek(now);
            
            let weekMinutes = 0;
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                const key = d.toISOString().split('T')[0];
                if (historyData[key]) {
                    weekMinutes += historyData[key].minutes;
                }
            }
            document.getElementById('weekMinutes').innerText = weekMinutes;

            const streak = calculateStreak();
            document.getElementById('streakDisplay').innerText = `🔥 ${streak}日連続！`;
        }

        function extractYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        function addYouTubeSong() {
            const input = document.getElementById('ytUrlInput');
            const val = input.value.trim();
            const videoId = extractYouTubeId(val);

            if (!videoId) {
                alert('有効なYouTubeのURLまたは動画IDを入力してください。');
                return;
            }

            youtubeSongs.push(videoId);
            input.value = '';
            saveSongs();
        }

        function removeSong(index) {
            youtubeSongs.splice(index, 1);
            saveSongs();
        }

        function updateSongListUI() {
            const container = document.getElementById('songListContainer');
            if (youtubeSongs.length === 0) {
                container.innerHTML = '<div class="no-song">まだ曲が選ばれていません。</div>';
                return;
            }

            let html = '';
            youtubeSongs.forEach((id, index) => {
                html += `
                    <div class="song-item">
                        <span>YouTube 曲 #${index + 1} (${id})</span>
                        <button onclick="removeSong(${index})">削除</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateCustomTime() {
            if (isRunning) return;
            const wInput = parseInt(document.getElementById('workTimeInput').value);

            if (wInput && wInput > 0 && wInput <= 180) {
                workDuration = wInput * 60;
                if (currentMode === 'work') timeLeft = workDuration;
            }
            updateDisplay();
        }

        function toggleWarmupMode() {
            if (isRunning) return;
            const isWarmup = document.getElementById('warmupCheck').checked;
            currentMode = isWarmup ? 'warmup' : 'work';
            updateDisplayUI();
            updateDisplay();
        }

        // ホワイトノイズ（自然音）の再生
        function startNatureSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                if (noiseNode) {
                    stopNatureSound();
                }

                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 500;

                noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

                noiseNode.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noiseNode.start();
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function stopNatureSound() {
            if (noiseNode) {
                try {
                    noiseNode.stop();
                    noiseNode.disconnect();
                } catch(e) {}
                noiseNode = null;
            }
        }

        // 「てん、てん、てん、パーン！」という通知音の再生
        function playFinishSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                // 「てん、てん、てん」（低いピピッ音を3回）
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now + i * 0.2); // D5音
                    gain.gain.setValueAtTime(0.15, now + i * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.15);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.2);
                    osc.stop(now + i * 0.2 + 0.15);
                }

                // 「パーン！」（少し高くて響くパーン音）
                const finalOsc = audioCtx.createOscillator();
                const finalGain = audioCtx.createGain();
                finalOsc.type = 'triangle';
                finalOsc.frequency.setValueAtTime(880, now + 0.6); // A5音（高音）
                finalGain.gain.setValueAtTime(0.3, now + 0.6);
                finalGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6 + 0.6);

                finalOsc.connect(finalGain);
                finalGain.connect(audioCtx.destination);
                finalOsc.start(now + 0.6);
                finalOsc.stop(now + 0.6 + 0.6);

            } catch (e) {
                console.log('Finish sound error:', e);
            }
        }

        function updateDisplay() {
            const timerDisplay = document.getElementById('timerDisplay');
            if (currentMode === 'work') {
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                timerDisplay.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                timerDisplay.style.fontSize = '64px';
            } else if (currentMode === 'warmup') {
                timerDisplay.innerText = "🎵 ウォーミングアップ";
                timerDisplay.style.fontSize = '28px';
            } else {
                timerDisplay.innerText = "🎵 休憩中";
                timerDisplay.style.fontSize = '32px';
            }
            
            let titleMode = (currentMode === 'work') ? '【勉強中】' : '【音楽再生中】';
            document.title = `${titleMode} - 自分専用ポモドーロ`;
        }

        function toggleTimer() {
            const btn = document.getElementById('startBtn');
            if (!isRunning) {
                isRunning = true;
                btn.innerText = '⏸ 一時停止';
                btn.style.background = 'var(--danger-bg)';

                if (currentMode === 'work') {
                    targetTimestamp = Date.now() + timeLeft * 1000;
                    startNatureSound();
                    document.getElementById('ytPlayerModal').style.display = 'none';
                    if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
                    timerInterval = setInterval(checkTimer, 500);
                } else {
                    playRandomYouTube();
                }
            } else {
                pauseTimer();
            }
        }

        function checkTimer() {
            if (!isRunning || currentMode !== 'work') return;
            const now = Date.now();
            const diffSec = Math.round((targetTimestamp - now) / 1000);

            if (diffSec > 0) {
                timeLeft = diffSec;
                updateDisplay();
            } else {
                handleWorkComplete();
            }
        }

        function pauseTimer() {
            isRunning = false;
            if (timerInterval) clearInterval(timerInterval);
            const btn = document.getElementById('startBtn');
            btn.innerText = (currentMode === 'work') ? '▶ スタート' : '▶ 音楽からスタート';
            btn.style.background = 'var(--accent-gradient)';

            stopNatureSound();
            if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                ytPlayer.pauseVideo();
            }
        }

        function resetTimer() {
            pauseTimer();
            const isWarmup = document.getElementById('warmupCheck').checked;
            currentMode = isWarmup ? 'warmup' : 'work';
            timeLeft = workDuration;
            document.getElementById('ytPlayerModal').style.display = 'none';
            if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
            updateDisplayUI();
            updateDisplay();
        }

        function skipTimer() {
            pauseTimer();
            if (currentMode === 'work') {
                handleWorkComplete();
            } else {
                handleMusicComplete();
            }
        }

        function handleWorkComplete() {
            stopNatureSound();
            playFinishSound(); // ここで「てん、てん、てん、パーン！」を鳴らす
            
            const todayKey = getTodayKey();
            if (!historyData[todayKey]) historyData[todayKey] = { sessions: 0, minutes: 0 };
            historyData[todayKey].sessions += 1;
            historyData[todayKey].minutes += Math.round(workDuration / 60);
            saveHistory();

            currentMode = 'break';
            updateDisplayUI();
            updateDisplay();

            playRandomYouTube();
        }

        function handleMusicComplete() {
            if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
            
            currentMode = 'work';
            timeLeft = workDuration;
            updateDisplayUI();
            updateDisplay();

            targetTimestamp = Date.now() + timeLeft * 1000;
            startNatureSound();
            document.getElementById('ytPlayerModal').style.display = 'none';
            timerInterval = setInterval(checkTimer, 500);
            
            isRunning = true;
            const btn = document.getElementById('startBtn');
            btn.innerText = '⏸ 一時停止';
            btn.style.background = 'var(--danger-bg)';
        }

        function updateDisplayUI() {
            const timerMessage = document.getElementById('timerMessage');
            const ytModal = document.getElementById('ytPlayerModal');
            const startBtn = document.getElementById('startBtn');

            if (currentMode === 'work') {
                timerMessage.innerText = '自動ループモード稼働中';
                ytModal.style.display = 'none';
                if (!isRunning) startBtn.innerText = '▶ スタート';
            } else if (currentMode === 'warmup') {
                timerMessage.innerText = 'まずは音楽で気分を高めましょう！';
                ytModal.style.display = 'block';
                if (!isRunning) startBtn.innerText = '▶ 音楽からスタート';
            } else {
                timerMessage.innerText = '曲が終わると次の勉強へ戻ります';
                ytModal.style.display = 'block';
                if (!isRunning) startBtn.innerText = '▶ 音楽からスタート';
            }
        }

        function playRandomYouTube() {
            if (youtubeSongs.length === 0) {
                handleMusicComplete();
                return;
            }

            const randomIndex = Math.floor(Math.random() * youtubeSongs.length);
            const videoId = youtubeSongs[randomIndex];

            document.getElementById('ytPlayerModal').style.display = 'block';

            if (ytPlayer) {
                ytPlayer.loadVideoById(videoId);
            } else {
                ytPlayer = new YT.Player('yt-player-frame', {
                    videoId: videoId,
                    playerVars: { 'autoplay': 1 },
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                if (currentMode === 'warmup' || currentMode === 'break') {
                    handleMusicComplete();
                }
            }
        }

        loadStorageData();
        updateDisplayUI();
        updateDisplay();
    </script>
</body>
</html>
