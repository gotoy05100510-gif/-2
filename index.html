<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自分専用ポモドーロ</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --card-border: #3a506b;
            --text-main: #ffffff;
            --text-sub: #8d99ae;
            --accent-gradient: linear-gradient(135deg, #4361ee, #7209b7);
            --accent-btn: #4361ee;
            --danger-bg: #ef233c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            margin-bottom: 5px;
        }

        .studio-name {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .mode-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .timer-display {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 10px 0;
        }

        .timer-message {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: var(--card-border);
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            flex: 2;
            background: var(--accent-gradient);
            color: white;
            padding: 16px;
        }

        .btn-secondary {
            flex: 1;
            background-color: #2b3a67;
            color: white;
            padding: 16px;
        }

        .btn-full {
            width: 100%;
            background-color: #2b3a67;
            color: white;
            padding: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }

        .setting-box {
            background-color: rgba(11, 19, 43, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .setting-label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stepper button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #2b3a67;
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stepper span {
            font-size: 18px;
            font-weight: 600;
            min-width: 45px;
            text-align: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
            color: var(--text-main);
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-btn);
            cursor: pointer;
        }

        .playlist-input-area {
            border: 2px dashed var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
            background-color: rgba(11, 19, 43, 0.3);
        }

        .url-input-row {
            display: flex;
            gap: 8px;
        }

        .url-input {
            flex: 1;
            background-color: #0b132b;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 14px;
        }

        .url-input:focus {
            outline: none;
            border-color: var(--accent-btn);
        }

        .btn-add {
            background-color: #4361ee;
            color: white;
            padding: 0 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .song-list {
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 5px;
        }

        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b132b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .song-item button {
            background: none;
            color: var(--danger-bg);
            font-size: 12px;
            padding: 2px 6px;
        }

        .no-song {
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            padding: 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }

        .stat-box {
            background-color: rgba(11, 19, 43, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* 休憩中に出現するYouTubeプレイヤー用ボックス */
        #ytPlayerModal {
            display: none;
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }
        #ytPlayerModal iframe {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="studio-name">Focus Studio</div>
            <h1>自分専用ポモドーロ</h1>
        </header>

        <!-- メインタイマー -->
        <div class="card">
            <div class="mode-indicator" id="modeIndicator">
                <span>📖</span> <span id="modeText">勉強時間</span>
            </div>
            <div class="timer-display" id="timerDisplay">30:00</div>
            <div class="timer-message" id="timerMessage">自分のペースで、少しずつ。</div>

            <!-- 休憩中にランダムなYouTube曲を表示する場所 -->
            <div id="ytPlayerModal">
                <div style="font-size: 13px; color: #4cc9f0; margin-bottom: 8px;">✨ 休憩用ランダム曲</div>
                <div id="iframeWrapper"></div>
            </div>

            <div class="divider" style="margin-top: 20px;"></div>

            <div class="button-group">
                <button class="btn-primary" id="startBtn" onclick="toggleTimer()">▶ スタート</button>
                <button class="btn-secondary" onclick="resetTimer()">↺ リセット</button>
            </div>
            <button class="btn-full" onclick="skipTimer()">次の時間へ</button>
        </div>

        <!-- 時間設定 -->
        <div class="card">
            <div class="section-title">⏱ 時間設定</div>
            <div class="settings-grid">
                <div class="setting-box">
                    <span class="setting-label">勉強時間</span>
                    <div class="stepper">
                        <button onclick="adjustTime('work', -1)">-</button>
                        <span id="workTimeSetting">30分</span>
                        <button onclick="adjustTime('work', 1)">+</button>
                    </div>
                </div>
                <div class="setting-box">
                    <span class="setting-label">休憩時間</span>
                    <div class="stepper">
                        <button onclick="adjustTime('break', -1)">-</button>
                        <span id="breakTimeSetting">5分</span>
                        <button onclick="adjustTime('break', 1)">+</button>
                    </div>
                </div>
            </div>
            <label class="checkbox-label">
                <input type="checkbox" id="randomPlayCheck" checked> 休憩開始時にYouTube音楽をランダム再生
            </label>
        </div>

        <!-- 休憩用プレイリスト -->
        <div class="card">
            <div class="section-title">🎵 休憩用YouTubeプレイリスト</div>
            <div class="playlist-input-area">
                <div style="font-size: 13px; color: var(--text-sub);">YouTubeのURLまたは動画IDを追加してください。</div>
                <div class="url-input-row">
                    <input type="text" id="ytUrlInput" class="url-input" placeholder="例: https://youtu.be/xxxx">
                    <button class="btn-add" onclick="addYouTubeSong()">追加</button>
                </div>
            </div>
            <div id="songListContainer" class="song-list">
                <div class="no-song">まだ曲が選ばれていません。</div>
            </div>
        </div>

        <!-- 今日の記録 -->
        <div class="card">
            <div class="section-title">📊 今日の記録</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">完了セッション</span>
                    <span class="stat-value" id="completedSessions">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">集中時間</span>
                    <span class="stat-value"><span id="totalFocusMinutes">0</span>分</span>
                </div>
            </div>
            <button class="btn-full" style="background-color: #2b3a67; font-size: 14px; padding: 12px;" onclick="resetStats()">記録をリセット</button>
        </div>

        <div class="footer-note">
            ※勉強中は心地よい自然音（ホワイトノイズ）が自動再生されます[span_4](start_span)[span_4](end_span)。
        </div>
    </div>

    <script>
        let workDuration = 30 * 60;
        let breakDuration = 5 * 60;
        let timeLeft = workDuration;
        let isRunning = false;
        let isWorkMode = true;
        let timerId = null;

        let youtubeSongs = [];

        // 綺麗な自然音（ホワイトノイズ＋なめらかなローパスフィルター）生成用
        let audioCtx = null;
        let noiseNode = null;
        let noiseGain = null;

        let stats = { sessions: 0, minutes: 0, date: new Date().toLocaleDateString() };

        function loadStats() {
            const saved = localStorage.getItem('pomodoro_stats');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.date === new Date().toLocaleDateString()) stats = data;
            }
            updateStatsUI();
        }

        function saveStats() {
            localStorage.setItem('pomodoro_stats', JSON.stringify(stats));
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('completedSessions').innerText = stats.sessions;
            document.getElementById('totalFocusMinutes').innerText = stats.minutes;
        }

        function resetStats() {
            if (confirm('今日の記録をリセットしますか？')) {
                stats.sessions = 0;
                stats.minutes = 0;
                saveStats();
            }
        }

        function extractYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        function addYouTubeSong() {
            const input = document.getElementById('ytUrlInput');
            const val = input.value.trim();
            const videoId = extractYouTubeId(val);

            if (!videoId) {
                alert('有効なYouTubeのURLまたは動画IDを入力してください。');
                return;
            }

            youtubeSongs.push(videoId);
            input.value = '';
            updateSongListUI();
        }

        function removeSong(index) {
            youtubeSongs.splice(index, 1);
            updateSongListUI();
        }

        function updateSongListUI() {
            const container = document.getElementById('songListContainer');
            if (youtubeSongs.length === 0) {
                container.innerHTML = '<div class="no-song">まだ曲が選ばれていません。</div>';
                return;
            }

            let html = '';
            youtubeSongs.forEach((id, index) => {
                html += `
                    <div class="song-item">
                        <span>YouTube 曲 #${index + 1} (${id})</span>
                        <button onclick="removeSong(${index})">削除</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 自然音（ノイズを完全にクリアで心地よい音にする修正版）
        function startNatureSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                // ギーという高周波をしっかりカットするローパスフィルター
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400; // 低めの心地よい雨音風

                noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.08, audioCtx.currentTime); // うるさくない音量

                noiseNode.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noiseNode.start();
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function stopNatureSound() {
            if (noiseNode) {
                try {
                    noiseNode.stop();
                    noiseNode.disconnect();
                } catch(e) {}
                noiseNode = null;
            }
        }

        function adjustTime(type, amount) {
            if (isRunning) return;
            if (type === 'work') {
                let mins = Math.round(workDuration / 60) + amount;
                if (mins >= 1 && mins <= 120) {
                    workDuration = mins * 60;
                    if (isWorkMode) timeLeft = workDuration;
                    document.getElementById('workTimeSetting').innerText = mins + '分';
                    updateDisplay();
                }
            } else {
                let mins = Math.round(breakDuration / 60) + amount;
                if (mins >= 1 && mins <= 60) {
                    breakDuration = mins * 60;
                    if (!isWorkMode) timeLeft = breakDuration;
                    document.getElementById('breakTimeSetting').innerText = mins + '分';
                }
            }
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            let titleMode = isWorkMode ? '【勉強中】' : '【休憩中】';
            document.title = `${titleMode} ${document.getElementById('timerDisplay').innerText} - 自分専用ポモドーロ`;
        }

        function toggleTimer() {
            const btn = document.getElementById('startBtn');
            if (!isRunning) {
                isRunning = true;
                btn.innerText = '⏸ 一時停止';
                btn.style.background = 'var(--danger-bg)';

                if (isWorkMode) {
                    startNatureSound();
                    document.getElementById('ytPlayerModal').style.display = 'none';
                } else {
                    playRandomYouTube();
                }

                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        handleTimerComplete();
                    }
                }, 1000);
            } else {
                pauseTimer();
            }
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerId);
            const btn = document.getElementById('startBtn');
            btn.innerText = '▶ スタート';
            btn.style.background = 'var(--accent-gradient)';

            stopNatureSound();
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = isWorkMode ? workDuration : breakDuration;
            document.getElementById('ytPlayerModal').style.display = 'none';
            updateDisplay();
        }

        function skipTimer() {
            pauseTimer();
            switchMode();
        }

        function handleTimerComplete() {
            stopNatureSound();

            if (isWorkMode) {
                stats.sessions += 1;
                stats.minutes += Math.round(workDuration / 60);
                saveStats();
                alert('勉強時間終了！お疲れ様でした。休憩に入ります。');
            } else {
                alert('休憩終了！次の勉強セッションを始めましょう。');
            }

            switchMode();
            updateDisplay();
        }

        function switchMode() {
            isWorkMode = !isWorkMode;
            timeLeft = isWorkMode ? workDuration : breakDuration;

            const modeIndicator = document.getElementById('modeIndicator');
            const timerMessage = document.getElementById('timerMessage');
            const ytModal = document.getElementById('ytPlayerModal');

            if (isWorkMode) {
                modeIndicator.innerHTML = '<span>📖</span> <span id="modeText">勉強時間</span>';
                timerMessage.innerText = '自分のペースで、少しずつ。';
                ytModal.style.display = 'none';
                document.getElementById('iframeWrapper').innerHTML = '';
            } else {
                modeIndicator.innerHTML = '<span>☕</span> <span id="modeText">休憩時間</span>';
                timerMessage.innerText = 'リフレッシュタイムです。';
                
                // 休憩に入ったら自動でYouTubeランダム表示
                const check = document.getElementById('randomPlayCheck').checked;
                if (check && youtubeSongs.length > 0) {
                    const randomIndex = Math.floor(Math.random() * youtubeSongs.length);
                    const videoId = youtubeSongs[randomIndex];
                    document.getElementById('iframeWrapper').innerHTML = `
                        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay" allowfullscreen></iframe>
                    `;
                    ytModal.style.display = 'block';
                }
            }
            updateDisplay();
        }

        function playRandomYouTube() {
            const check = document.getElementById('randomPlayCheck').checked;
            if (check && youtubeSongs.length > 0) {
                const randomIndex = Math.floor(Math.random() * youtubeSongs.length);
                const videoId = youtubeSongs[randomIndex];
                document.getElementById('iframeWrapper').innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay" allowfullscreen></iframe>
                `;
                document.getElementById('ytPlayerModal').style.display = 'block';
            }
        }

        loadStats();
        updateDisplay();
    </script>
</body>
</html>
